<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2C423F">
  <title>Entrar — PlusNote</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="login.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>
  <main class="auth-page">
    <div class="auth-brand">
      <img src="logo.svg" alt="PlusNote" class="auth-logo">
      <span><strong>PlusNote</strong><small>Controle acadêmico</small></span>
    </div>

    <section class="auth-card">
      <span class="eyebrow">BEM-VINDO DE VOLTA</span>
      <h1>Entrar na sua conta</h1>
      <p>Continue acompanhando suas matérias e pontuações.</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" placeholder="seu@email.com" required>
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" autocomplete="current-password" placeholder="Sua senha" required>
        </div>
        <button class="button" id="loginButton" type="submit">Entrar</button>
        <p id="authStatus" class="auth-status" aria-live="polite"></p>
      </form>

      <div class="auth-footer">
        Não possui conta? <a href="cadastro.html">Criar conta</a>
      </div>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
