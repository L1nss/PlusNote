<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - PlusNote</title>

<link rel="stylesheet" href="login.css">

</head>


<body>


<button id="themeToggle" class="theme-button">
🌙
</button>


<script src="theme.js"></script>
<script src="login.js"></script>



<div class="login-container">


<div class="logo">
+
</div>


<h1>
PlusNote
</h1>


<p>
Entre para continuar controlando suas notas
</p>




<form id="loginForm">



<div class="input-group">

<label>
Email
</label>


<input 
type="email"
id="email"
placeholder="Digite seu email"
required>


</div>





<div class="input-group">

<label>
Senha
</label>


<input 
type="password"
id="senha"
placeholder="Digite sua senha"
required>


</div>





<button type="submit">

Entrar

</button>




</form>




<a href="#">
Esqueceu sua senha?
</a>





<div class="cadastro">

Ainda não possui conta?

<a href="#">
Criar conta
</a>


</div>



</div>





<script src="theme.js"></script>

<script src="login.js"></script>



</body>

</html>
