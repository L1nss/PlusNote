<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2C423F">
  <title>Criar conta — PlusNote</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="login.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>
  <main class="auth-page">
    <div class="auth-brand">
      <img src="logo.svg" alt="PlusNote" class="auth-logo">
      <span><strong>PlusNote</strong><small>Controle acadêmico</small></span>
    </div>

    <section class="auth-card">
      <span class="eyebrow">PRIMEIRO ACESSO</span>
      <h1>Criar sua conta</h1>
      <p>Seus dados ficam vinculados à sua conta e sincronizados no banco.</p>

      <form id="cadastroForm">
        <div class="field">
          <label for="nome">Nome</label>
          <input type="text" id="nome" autocomplete="name" placeholder="Seu nome" maxlength="80" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" placeholder="seu@email.com" required>
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" autocomplete="new-password" minlength="6" placeholder="Mínimo de 6 caracteres" required>
        </div>
        <button class="button" id="cadastroButton" type="submit">Criar conta</button>
        <p id="authStatus" class="auth-status" aria-live="polite"></p>
      </form>

      <div class="auth-footer">
        Já possui conta? <a href="login.html">Entrar</a>
      </div>
    </section>
  </main>
  <script src="cadastro.js"></script>
</body>
</html>
