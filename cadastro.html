<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Criar Conta - PlusNote</title>

<link rel="stylesheet" href="login.css">

</head>

<body>

<div class="login-container">

   <div class="logo-container">
    <img src="Gemini_Generated_Image_tuohfltuohfltuoh.png" class="logo-site" alt="Logo PlusNote">
</div>

    <h1>PlusNote</h1>

    <p>Criar nova conta</p>


    <input 
    type="text"
    id="nome"
    placeholder="Nome">


    <input 
    type="email"
    id="email"
    placeholder="Email">


    <input 
    type="password"
    id="senha"
    placeholder="Senha">


    <button onclick="criarConta()">
        Criar conta
    </button>


  


    <div class="cadastro">

        Já possui conta?

        <a href="login.html">
            Entrar
        </a>

    </div>


</div>


<script src="cadastro.js"></script>

</body>
</html>
