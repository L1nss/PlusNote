<!DOCTYPE html>

<html lang="pt-BR">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>PlusNote</title>



<link rel="stylesheet" href="styles.css">



<script>


if(localStorage.getItem("usuarioLogado") !== "true"){

window.location.href="login.html";

}


</script>



</head>



<body>



<header>



<!-- Cole este bloco onde a logo deve aparecer no seu site -->
<div class="logo-container">
    <img src="Gemini_Generated_Image_tuohfltuohfltuoh.png" alt="Logo PlusNote" class="logo-site">
</div>

</div>



<h1>

PlusNote

</h1>



<p>

Você no controle de suas notas

</p>



<button onclick="sair()">

Sair

</button>



</header>





<button id="themeToggle" class="theme-button">

🌙

</button>





<main>



<section>


<h2>
⚙ Configuração
</h2>



<label>

Sistema de avaliação

</label>



<select id="modoAvaliacao" onchange="alterarModo()">



<option value="nota">

Notas

</option>



<option value="conceito">

Conceitos

</option>



</select>





<label>

Período letivo

</label>



<select id="tipoPeriodo" onchange="alterarPeriodo()">



<option value="trimestre">

Trimestre

</option>



<option value="bimestre">

Bimestre

</option>



<option value="semestre">

Semestre

</option>


</select>






<label>

Pontos anuais necessários

</label>



<input

type="number"

id="mediaNecessaria"

value="60"

min="0"

max="100"

>





<button onclick="salvarConfiguracao()">

Salvar configuração

</button>



</section>






<section id="areaConceitos" class="oculto">



<h2>

Cadastro de conceitos

</h2>




<input

type="text"

id="nomeConceito"

placeholder="Ex: CSA"

>





<input

type="number"

id="minimoConceito"

placeholder="Valor mínimo"

>




<input

type="number"

id="maximoConceito"

placeholder="Valor máximo"

>




<button onclick="adicionarConceito()">

Adicionar conceito

</button>




<div id="listaConceitos">

</div>



</section>







<section>


<h2>

Nova matéria

</h2>



<input

type="text"

id="materia"

placeholder="Digite a matéria"

>




<button onclick="adicionarMateria()">

Adicionar matéria

</button>


</section>








<section>


<h2>

Minhas matérias

</h2>



<div id="listaMaterias">

</div>



</section>





</main>





<script src="theme.js"></script>


<script src="script.js"></script>




<script>


function sair(){


localStorage.removeItem(
"usuarioLogado"
);


window.location.href="login.html";


}


</script>




</body>


</html>
